subject: 项目经历
listing-order: 4
icon: "/assets/img/clipboard-list.svg"
contents:
  - title: "影像管理平台 ([# 内网项目](#))"
    description:
      - 技术栈：Spring Cloud + Spring Boot + Consul + Zuul + Redis + RocketMQ + PostgreSQL + Elasticsearch
      - 参与影像管理中台核心模块设计与开发，作为集团公共中台系统，统一各子公司影像文件增删改查归口管理，定义标准化接口规范与数据库模型
      - 集成华为云 OBS 对象存储，实现影像文件云端持久化存储、分层归档与在线预览访问
      - 支撑高并发影像批量上传、分片上传机制，基于 Redis 实现接口限流、重复上传拦截与临时文件缓存，保障高并发场景系统稳定
      - 基于 RabbitMQ 实现影像异步转码、文件归档、业务消息解耦，削峰填谷减轻前端上传压力，提升整体系统吞吐量
      - 采用 Elasticsearch 构建影像全文检索能力，支持文件名、标签、业务类型、上传时间多条件组合检索，大幅优化查询响应速度
  - title: "珠江健康智慧养老商城健康平台 ([https://zjh.gzzjjk.com.cn/shop](https://zjh.gzzjjk.com.cn/shop))"
    description:
      - 技术栈：Spring Cloud + Spring Boot + Nacos + Gateway + Redis + RabbitMQ + PostgreSQL + Elasticsearch
      - 独立负责订单、优惠券、支付中心模块设计与开发，定义接口规范与数据库模型
      - 对接第三方支付，实现支付回调、状态同步、幂等防重，保障资金与订单数据一致
      - 基于 Seata AT 模式解决跨服务分布式事务，保证订单、库存、账务数据最终一致性
      - 使用 Elasticsearch 实现商品全文检索、多条件筛选，优化搜索接口响应速度
      - 参与 Docker 镜像打包、服务器部署、Nginx 负载均衡配置，支撑大促高并发场景
  - title: "湖北药械妆个例报告直报系统 ([https://hbadr.gzpykj.com/hb-adr](https://hbadr.gzpykj.com/hb-adr))"
    description:
      - 技术栈：Spring Cloud + Spring Boot + Vue + 原生微信小程序 + Zuul + Apollo + PostgreSQL + Flowable
      - 担任项目开发组长，主导项目架构与技术选型
      - 负责微信小程序端的开发，配合用户角色权限研发管理端和用户端
      - 使用 Flowable 开发流程审批、消息通知、定时数据统计归档等通用业务模块
  - title: "广西药械化不良反应事件药物滥用监测数据分析系统 ([https://bg.yjj.gxzf.gov.cn/gxdams](https://bg.yjj.gxzf.gov.cn/gxdams))"
    description:
      - 全栈 Web 应用程序，前端使用 JSP，后端使用 Spring Cloud，根据药监局数据进行多维度的数据分析
      - 多源异构数据，包括 Excel、CSV、JSON，一键接入并清洗、脱敏数据后入库
      - 使用 DataX 和 ECharts 进行数据分析，支持分析报告一键生成
      - 使用 XXL-Job 进行定时任务调度，定期对药物滥用数据进行分析并对异常数据进行邮件、企微等渠道告警
      - 封装 Excel 导入导出、文件上传、通用工具类，提升团队开发效率
