subject: 工作经验
listing-order: 3
icon: "/assets/img/briefcase.svg"
contents:
  - title: 深圳数鑫科技有限公司
    role: 服务端工程师
    description:
      - 负责参与公司数据可信空间产品的服务端研发
      - 负责公司统一网关和数据可信空间 2.0 的身份关系认证模块开发
      - 参与 OpenResty 框架的 Lua 脚本扩展 Nginx 的高性能网关开发
      - 负责 Docker 镜像打包，Jenkins CI/CD 自动化部署
    date: 2026.06 - 2026.08
  - title: 中国人保<span style="color:#999;">（信雅达、云南南天驻场中国人保）</span>
    role: Java 研发工程师
    description:
      - 负责影像管理中台微服务后端接口开发，完成影像文件业务需求迭代、功能开发与线上日常维护
      - 整合华为云 OBS 对象存储，实现影像文件上传、存储、预览、下载及归档全流程业务能力
      - 参与国产信创改造适配，以及实现百亿级数据从 PostgreSQL 到 HGDB 数据量的迁移工作
      - 运用 Redis 实现并发上传限流、防重提交及热点影像数据缓存，有效提升接口响应速度与系统并发能力
      - 基于 RocketMQ 实现异步消息解耦，处理影像文件后台转码、归档等异步任务，削峰填谷提升系统吞吐量
      - 基于 Elasticsearch 实现影像文件全文检索、多条件组合筛选，优化检索查询体验与查询效率
      - 参与 Consul 服务注册配置、Zuul 网关路由及权限拦截配置，参与项目测试、测试环境流水线搭建，使用 Git 进行代码版本管控与团队分支协作
      - 参与基于 Vue3 的影像页面开发，包括 CRUD、OCR 识别、智能分类功能的迭代和维护
    date: 2024.05 - 2026.06
  - title: 广州市华观信息科技有限公司
    role: 全栈工程师
    description:
      - 负责参与公司的中台、商城及数据分析系统的研发
      - 负责各类后台管理系统、业务系统后端接口开发，完成需求功能迭代与日常维护
      - 使用 Spring Boot + MyBatis 进行业务 CRUD 开发，编写复杂 SQL、优化查询效率
      - 配合前端进行接口联调、参数校验、数据格式封装，及时修复线上及测试Bug
      - 运用 Redis 实现登录缓存、业务数据缓存，提升接口响应速度
      - 参与项目测试环境、生产环境部署，使用 Git 进行代码版本管理与分支协作
      - 负责业务系统的定时任务开发、数据统计、报表导出等业务功能
    date: 2022.06 - 2024.04
  - title: 广州市华观信息科技有限公司
    role: Java 研发实习
    description:
      - 参与业务需求对接、SQL 性能优化，配合前端完成接口联调与问题修复
      - 负责需求文档、接口文档、开发设计文档编写，保障团队协作标准化
      - 负责业务系统数据导入、导出模块封装及数据分析
    date: 2022.03 - 2022.06
